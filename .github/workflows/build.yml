name: FerrariPOS Windows + Gemini Worker

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferraripos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-build:
    name: Compilar EXE e Setup de Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias FerrariPOS
        run: dotnet restore FerrariPOS.Windows/FerrariPOS.csproj -r win-x64

      - name: Compilar y publicar FerrariPOS para Windows x64
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'release/FerrariPOS-Windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish FerrariPOS.Windows/FerrariPOS.csproj -c Release -r win-x64 --self-contained true --no-restore -o $out -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'Falló dotnet publish de FerrariPOS.' }
          $exe = Join-Path $out 'FerrarisPOS.exe'
          if (!(Test-Path $exe)) { Get-ChildItem $out -Recurse | Format-Table FullName; throw 'No se encontró release/FerrariPOS-Windows/FerrarisPOS.exe.' }

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Generar instalador de Windows
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe' }
          if (!(Test-Path $iscc)) { throw 'No se encontró ISCC.exe de Inno Setup.' }
          $output = Join-Path $env:GITHUB_WORKSPACE 'release/Setup'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $iscc /DProjectDir="$env:GITHUB_WORKSPACE/FerrariPOS.Windows" /DBuildDir="$env:GITHUB_WORKSPACE/release/FerrariPOS-Windows" /DOutputDir="$output" "$env:GITHUB_WORKSPACE/FerrariPOS.Windows/Setup_FerrariPOS_V73_1_59.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup no pudo crear el instalador.' }
          if (!(Get-ChildItem $output -Filter '*.exe' -File | Select-Object -First 1)) { throw 'No se generó el instalador EXE.' }

      - name: Subir EXE portable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Windows-EXE
          path: release/FerrariPOS-Windows/FerrarisPOS.exe
          if-no-files-found: error
          retention-days: 30

      - name: Subir instalador Windows como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FerrariPOS-Windows-Setup
          path: release/Setup/*.exe
          if-no-files-found: error
          retention-days: 30

  worker-validate-deploy:
    name: Validar y desplegar Worker Gemini en Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Cloudflare/FerrariPOS-Asistente-IA
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar secretos requeridos
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Falta CLOUDFLARE_API_TOKEN en Settings > Secrets and variables > Actions'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Falta CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions'; exit 1; }

      - name: Instalar dependencias del Worker
        run: npm install --no-audit --no-fund

      - name: Validar sintaxis JavaScript
        run: node --check src/index.js

      - name: Validar configuración Wrangler sin publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Desplegar Worker en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
